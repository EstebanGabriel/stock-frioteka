<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A6C9E">
<title>Stock FRIOTEKA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: barra fija arriba con pestañas, lista larga de una columna con controles grandes para cargar parado en la cámara, barra de acción abajo. */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --sunk:#E1E9EE; --line:#CBD7DF;
  --ink:#0F2230; --muted:#566B7A; --accent:#0A6C9E; --on-accent:#FFFFFF;
  --ok:#1C7C54; --ok-bg:#DDF1E7; --warn:#B4480B; --warn-bg:#FCE7D8; --wait:#7A6A1E; --wait-bg:#F5EFCB;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B151C; --surface:#13212B; --sunk:#0F1B24; --line:#27394A;
  --ink:#E6EEF3; --muted:#93A8B6; --accent:#4FB3E3; --on-accent:#06202E;
  --ok:#5FCB98; --ok-bg:#12382A; --warn:#F39A63; --warn-bg:#40200E; --wait:#DCCB6C; --wait-bg:#37320F;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B151C; --surface:#13212B; --sunk:#0F1B24; --line:#27394A;
  --ink:#E6EEF3; --muted:#93A8B6; --accent:#4FB3E3; --on-accent:#06202E;
  --ok:#5FCB98; --ok-bg:#12382A; --warn:#F39A63; --warn-bg:#40200E; --wait:#DCCB6C; --wait-bg:#37320F;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin-inline:auto;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0}
h1 span{color:var(--accent)}
.sync{font-size:13px;color:var(--muted);white-space:nowrap}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
.areas button{min-width:0;border:0;border-radius:7px;background:none;padding:8px 2px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.areas button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs[hidden]{display:none}
.src{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.src div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.src b{font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.src span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.src small{font-size:12px;color:var(--muted)}
.qty{font-variant-numeric:tabular-nums}
.qty b{color:var(--ink)}
.tag.sum{background:var(--accent);color:var(--on-accent);font-size:13px;padding:2px 8px}
.ttbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ttbl table{font-size:14px;min-width:340px}
.ttbl th,.ttbl td{padding:7px 5px;vertical-align:top}
.ttbl th{font-size:11px;letter-spacing:.02em;white-space:nowrap}
.ttbl td:first-child,.ttbl th:first-child{padding-left:10px;width:46%}
.ttbl td:last-child,.ttbl th:last-child{padding-right:10px}
.ttbl th small{display:block;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:none}
.ttbl td.num{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}
.ttbl .tn{display:block;font-weight:500;overflow-wrap:anywhere}
.ttbl .tc{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ttbl .tsum{background:var(--sunk)}
.ttbl .tsum b{color:var(--accent)}
.ttbl .cu{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);border-top:1px solid var(--line);margin-top:3px;padding-top:2px}
.ttbl .nil{color:var(--muted);font-weight:400}
.ttbl tr.sec td{background:var(--bg);padding-left:8px}
.addrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:14px 150px;display:flex;flex-direction:column;gap:14px}
.notice{background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:10px 12px;font-size:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.head h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:14px}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools input[type=search]{flex:1;min-width:160px;height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7;font-variant-numeric:tabular-nums}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--accent);font-size:14px;padding:6px 0;font-family:var(--body);text-transform:none;letter-spacing:0;text-decoration:underline}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{background:var(--surface);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px}
.row.done{background:var(--sunk)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.tag.out{background:var(--warn-bg);color:var(--warn)} .tag.wait{background:var(--wait-bg);color:var(--wait)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.step{flex:none;display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:24px;line-height:1;font-weight:500}
.step button:active{background:var(--line)}
.step input{width:54px;height:44px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;padding:0}
.step input::placeholder{color:var(--muted);font-weight:600}
.row.zero .step input{color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tot{flex:1;min-width:130px;display:flex;flex-direction:column}
.tot b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tot span{font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.confirm{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:8px 10px;font-size:14px}
.confirm span{flex:1;min-width:160px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist>button{width:100%;background:none;border:0;text-align:left;padding:12px;display:grid;grid-template-columns:auto minmax(30px,1fr) auto;gap:4px 12px;align-items:center}
.hist .d{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.hist .n{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);text-align:right}
.hist .n b{color:var(--ink);font-size:16px}
.hbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:0}
.hbar i{display:block;height:100%;background:var(--accent)}
.hbody{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;padding-left:8px}
tr.sec td{font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text],.form select{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.form .grow{flex:1 1 100%;min-width:0}
.form select{max-width:100%;flex:1 1 180px}
.form label{display:flex;align-items:center;gap:6px;font-size:14px;min-height:44px}
.form label input[type=text]{min-width:0}
.form input[type=checkbox]{width:20px;height:20px}
.row.off .nm{color:var(--muted);text-decoration:line-through}
.row>button.info{background:none;border:0;text-align:left;padding:4px 0}
.edit{background:var(--sunk);padding:10px 12px}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(8,18,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:760px;max-height:88%;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0}
.sheet textarea{flex:1;min-height:220px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-size:14px;resize:none}
.sheet a{color:var(--accent)}
.tag.ideal{background:var(--accent);color:var(--on-accent);font-size:13px;padding:2px 8px}
.tag.up{background:var(--ok-bg);color:var(--ok)} .tag.down{background:var(--warn-bg);color:var(--warn)} .tag.eq{background:var(--sunk);color:var(--muted)}
.spark{flex:none;width:92px;height:34px;color:var(--accent)}
.spark .ar{fill:currentColor;opacity:.14} .spark .ln{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round} .spark .pt{fill:currentColor} .spark .gl{stroke:var(--line);stroke-width:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.trow{display:grid;grid-template-columns:52px 1fr 92px;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:14px}
.trow b{font-family:var(--display);font-size:17px} .trow span:last-child{text-align:right;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90%}
@media (max-width:460px){ .areas button{font-size:14px;letter-spacing:0} .src{gap:6px} .src b{font-size:20px}  .step button{width:40px} .step input{width:48px} .tabs{gap:0} .tabs button{font-size:15px;letter-spacing:0;padding-inline:0} }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var view=$("view"), bar=$("bar"), sheet=$("sheet");
var S={area:"camara",ftab:"conteo",fq:"",fhist:null,fconfirm:false,tq:"",tall:false,tab:"conteo",rubro:"",q:"",filtro:"todos",hv:"pedidos",tend:"todos",ide:null,hist:null,edit:null,confirm:false,limpiar:false,adding:false,readOnly:false};
var DB=null, DL=null, cat=null, pedidos=[], loaded={cat:false,ped:false};
var ov={stock:{},ajuste:{}}, pend={stock:{},ajuste:{}}, chain=Promise.resolve(), timer=null, saving=0;
try{var t=localStorage.getItem("tab"); if(t) S.tab=t; var ar=localStorage.getItem("area"); if(ar) S.area=ar; var ft=localStorage.getItem("ftab"); if(ft==="conteo"||ft==="historial") S.ftab=ft;}catch(e){}

/* ---------- datos ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(f){var p=String(f).slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function fmtC(f){var p=String(f).slice(0,10).split("-");return p[2]+"/"+p[1]}
function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function cj(n){return n+(n===1?" caja":" cajas")}
function items(){return cat?cat.items:[]}
function activos(){return items().filter(function(i){return i.a!==false})}
function rubros(){var r=[];items().forEach(function(i){if(r.indexOf(i.r)<0)r.push(i.r)});return r}
function abierto(){for(var i=pedidos.length-1;i>=0;i--)if(pedidos[i].estado==="abierto")return pedidos[i];return null}
function enviados(){return pedidos.filter(function(p){return p.estado==="enviado"})}
function previo(){var e=enviados();return e.length?e[e.length-1]:null}
function num(v){return typeof v==="number"&&isFinite(v)?v:null}
function stockOf(c){if(c in ov.stock)return num(ov.stock[c]);var a=abierto();return a&&a.stock?num(a.stock[c]):null}
function ajusteOf(c){if(c in ov.ajuste)return num(ov.ajuste[c]);var a=abierto();return a&&a.ajuste?num(a.ajuste[c]):null}
/* Ideal de partida: lo que quedó en cámara después del último pedido (stock contado + cajas pedidas). */
function idealPrevio(c){var p=previo();if(!p||!p.stock)return null;var s=num(p.stock[c]);if(s===null)return null;return s+(num(p.pedido&&p.pedido[c])||0)}
function sugerido(it){if(it.sc===false)return 0;var s=stockOf(it.c);if(s===null)return null;var b=idealPrevio(it.c);if(b===null)return 0;return Math.max(0,b-s)}
function pedidoDe(it){var a=ajusteOf(it.c);if(a!==null)return a;return sugerido(it)||0}
function totales(){var t=0,n=0,falta=0;activos().forEach(function(it){var p=pedidoDe(it);t+=p;if(p>0)n++;if(it.sc!==false&&stockOf(it.c)===null)falta++});return {t:t,n:n,falta:falta}}
function kilos(map){var k=0,sin=0,by={};items().forEach(function(i){by[i.c]=i});for(var c in (map||{})){var q=num(map[c]);if(!q)continue;var it=by[c],w=it?num(it.kg):null;if(w)k+=q*w;else sin+=q}return {k:Math.round(k),sin:sin}}
function fk(n){return n.toLocaleString("es-AR")+" kg"}
function dec(v){v=parseFloat(String(v).replace(",","."));return isFinite(v)&&v>0?Math.round(v*100)/100:null}
function sum(o){var t=0,n=0;for(var k in (o||{})){var v=num(o[k]);if(v){t+=v;n++}}return {t:t,n:n}}

/* ---------- guardado ---------- */
function setSync(){var el=$("sync");if(!DB){el.textContent="Sin conexión a los datos";return}
  if(S.readOnly){el.textContent="Solo lectura";return}
  if(navigator.onLine===false){el.textContent="Sin señal · se guarda en el teléfono";return}
  el.textContent=(saving||timer||fzTimer)?"Guardando…":"Guardado"}
window.addEventListener("online",function(){setSync()});window.addEventListener("offline",function(){setSync()});
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}
function fail(e){saving=Math.max(0,saving-1);
  if(e&&e.code==="permission-denied"){S.readOnly=true;toast("La base no acepta cambios desde acá. Avisale a Banchi.")}
  else if(e&&e.code==="resource-exhausted")toast("Se llegó al límite de uso de la base. Probá más tarde.");
  else toast("No se pudo guardar. Revisá la conexión y volvé a intentar.");
  setSync()}
function write(fn){saving++;setSync();var p;try{p=Promise.resolve(fn())}catch(e){p=Promise.reject(e)}return p.then(function(){saving=Math.max(0,saving-1);setSync();return true},function(e){fail(e);return false})}
function flush(){clearTimeout(timer);timer=null;var a=abierto();
  if(!a||(!Object.keys(pend.stock).length&&!Object.keys(pend.ajuste).length)){setSync();return chain}
  var patch={};if(Object.keys(pend.stock).length)patch.stock=pend.stock;if(Object.keys(pend.ajuste).length)patch.ajuste=pend.ajuste;
  pend={stock:{},ajuste:{}};var ref=DB.doc("pedidos/"+a.id);
  return write(function(){return ref.update(patch)})}
function queue(){clearTimeout(timer);timer=setTimeout(flush,700);setSync()}
function setStock(c,v){if(S.readOnly||!abierto())return;ov.stock[c]=v;pend.stock[c]=v;queue()}
function setAjuste(c,v){if(S.readOnly||!abierto())return;ov.ajuste[c]=v;pend.ajuste[c]=v;queue()}
function settle(){var a=abierto();["stock","ajuste"].forEach(function(k){for(var c in ov[k]){if(c in pend[k])continue;var dv=a&&a[k]?a[k][c]:undefined;if((dv===undefined?null:dv)===ov[k][c])delete ov[k][c]}})}

/* ---------- filas ---------- */
function stepper(pref,c,val,ph,lab){return '<div class="step"><button type="button" data-a="-" aria-label="Restar una caja">−</button>'+
  '<input id="'+pref+c+'" type="text" inputmode="numeric" autocomplete="off" value="'+(val===null?"":val)+'" placeholder="'+ph+'" aria-label="'+lab+'">'+
  '<button type="button" data-a="+" aria-label="Sumar una caja">+</button></div>'}
function rowConteo(it){var s=stockOf(it.c),b=idealPrevio(it.c);
  return '<li class="row'+(s!==null?" done":"")+'" data-c="'+it.c+'"><div class="info"><span class="nm">'+esc(it.n)+'</span><span class="meta"><span>'+it.c+'</span>'+
  (b!==null?"<span>ideal anterior "+b+"</span>":"")+(s===0?'<span class="tag out">Sin stock</span>':"")+'</span></div>'+stepper("s",it.c,s,"–","Cajas en cámara de "+esc(it.n))+'</li>'}
function rowPedido(it){var s=stockOf(it.c),p=pedidoDe(it),b=idealPrevio(it.c),sg=sugerido(it),aj=ajusteOf(it.c),m="";
  if(it.sc===false)m="<span>Sin conteo, pedido a ojo</span>";
  else if(s===null)m='<span class="tag wait">Sin contar</span>'+(b!==null?"<span>ideal anterior "+b+"</span>":"");
  else{m="<span>Stock "+s+"</span>";if(b!==null)m+="<span>salieron "+Math.max(0,b-s)+"</span>";m+='<span class="tag ideal">Ideal '+(s+p)+'</span>';if(b!==null&&b!==s+p)m+="<span>antes "+b+"</span>";if(s===0&&b)m+='<span class="tag out">Agotado</span>'}
  if(aj!==null&&sg!==null&&aj!==sg&&it.sc!==false)m+='<button type="button" class="link" data-a="reset">volver a '+sg+'</button>';
  return '<li class="row'+(p===0?" zero":"")+'" data-c="'+it.c+'"><div class="info"><span class="nm">'+esc(it.n)+'</span><span class="meta"><span>'+it.c+'</span>'+m+'</span></div>'+stepper("p",it.c,p,"0","Cajas a pedir de "+esc(it.n))+'</li>'}
function match(it){if(S.rubro&&it.r!==S.rubro)return false;if(S.q){var q=S.q.toLowerCase();if(it.n.toLowerCase().indexOf(q)<0&&String(it.c).indexOf(q)<0)return false}return true}
function groups(list,rowFn,extra){var h="";rubros().forEach(function(r){var l=list.filter(function(i){return i.r===r});if(!l.length)return;
  h+='<section class="grp"><h3><span>'+esc(r)+'</span>'+(extra?extra(r,l):"")+'</h3><ul>'+l.map(rowFn).join("")+'</ul></section>'});return h}
function chipsHTML(list,counter){var h='<button type="button" class="chip" data-rubro="" aria-pressed="'+(S.rubro===""?"true":"false")+'">Todos</button>';
  rubros().forEach(function(r){var l=list.filter(function(i){return i.r===r});if(!l.length)return;
    h+='<button type="button" class="chip" data-rubro="'+esc(r)+'" aria-pressed="'+(S.rubro===r?"true":"false")+'">'+esc(r.toLowerCase().replace(/^./,function(c){return c.toUpperCase()}))+' <small>'+counter(l)+'</small></button>'});return h}
function tools(list,counter){return '<div class="tools"><input id="buscar" type="search" placeholder="Buscar producto o código" value="'+esc(S.q)+'" aria-label="Buscar producto"></div><div class="chips" id="chips">'+chipsHTML(list,counter)+'</div>'}
function sinAbierto(){var p=previo(),t=p?sum(p.pedido):null;
  return '<div class="empty"><div class="head"><h2>No hay conteo abierto</h2></div><p>'+(p?"El último pedido fue el "+fmt(p.fecha)+": "+cj(t.t)+" en "+t.n+" productos. El conteo nuevo arranca con esos ideales.":"Todavía no hay pedidos cargados.")+
  '</p><button type="button" class="btn pri" data-a="nuevo"'+(S.readOnly?" disabled":"")+'>Empezar el conteo de hoy</button></div>'}

/* ---------- vistas ---------- */
function vConteo(){var a=abierto();if(!a)return sinAbierto();
  var cont=activos().filter(function(i){return i.sc!==false}),hechos=cont.filter(function(i){return stockOf(i.c)!==null}).length;
  var cnt=function(l){return l.filter(function(i){return stockOf(i.c)!==null}).length+"/"+l.length};
  var list=cont.filter(match);
  return '<div class="head"><h2>Conteo del '+fmt(a.fecha)+'</h2><p id="prog-t">'+hechos+" de "+cont.length+' productos contados</p></div><div class="prog"><i id="prog-b" style="width:'+(cont.length?hechos/cont.length*100:0)+'%"></i></div>'+
  (S.limpiar?'<div class="confirm"><span>Se borran las '+hechos+' cantidades cargadas y el conteo arranca de nuevo.</span><button type="button" class="btn" data-a="limpiar-no">Cancelar</button><button type="button" class="btn pri" data-a="limpiar-si">Limpiar</button></div>'
   :'<div><button type="button" class="btn danger" data-a="limpiar"'+(S.readOnly?" disabled":"")+'>Limpiar conteo</button></div>')+
  tools(cont,cnt)+(list.length?groups(list,rowConteo,function(r,l){return l.some(function(i){return stockOf(i.c)===null})?'<button type="button" class="link" data-a="ceros" data-r="'+esc(r)+'">Poner en 0 los que faltan</button>':""}):'<div class="empty"><p>Ningún producto coincide con la búsqueda.</p></div>')}
function vPedido(){var a=abierto();if(!a)return sinAbierto();
  var act=activos(),cnt=function(l){var t=0;l.forEach(function(i){t+=pedidoDe(i)});return t};
  var f=[["todos","Todos"],["pedir","A pedir"],["agotados","Agotados"],["falta","Sin contar"]];
  var list=act.filter(match).filter(function(i){var s=stockOf(i.c);
    return S.filtro==="pedir"?pedidoDe(i)>0:S.filtro==="agotados"?s===0:S.filtro==="falta"?(i.sc!==false&&s===null):true});
  return '<div class="head"><h2>Pedido del '+fmt(a.fecha)+'</h2><p>Sugerido = ideal anterior − stock. Ajustá lo que haga falta.</p></div>'+
  '<div class="chips">'+f.map(function(x){return '<button type="button" class="chip" data-filtro="'+x[0]+'" aria-pressed="'+(S.filtro===x[0]?"true":"false")+'">'+x[1]+'</button>'}).join("")+'</div>'+
  tools(act,cnt)+(list.length?groups(list,rowPedido):'<div class="empty"><p>No hay productos en este filtro.</p></div>')}
function barPedido(){if(S.area!=="camara"){barFz();return}var a=abierto();if(S.tab!=="pedido"||!a){bar.hidden=true;return}
  var t=totales(),kg=kilos(mapaActual()),h='<div class="wrap"><div class="tot"><b>'+cj(t.t)+'</b><span>'+t.n+" productos · "+fk(kg.k)+(kg.sin?" + "+kg.sin+" sin peso":"")+(t.falta?" · faltan contar "+t.falta:"")+'</span></div><div class="acts">'+
  '<button type="button" class="btn" data-a="wsp">WhatsApp</button>'+(DL&&window.XLSX?'<button type="button" class="btn" data-a="xls">Excel</button>':"")+(DL&&window.jspdf?'<button type="button" class="btn" data-a="pdf">PDF</button>':"")+
  '<button type="button" class="btn pri" data-a="cerrar"'+(S.readOnly?" disabled":"")+'>Cerrar pedido</button></div>';
  if(S.confirm)h+='<div class="confirm"><span>'+(t.falta?"Faltan contar "+t.falta+" productos; quedan sin pedir. ":"")+'Al cerrar, este pedido pasa al historial y fija los ideales del próximo.</span><button type="button" class="btn" data-a="no">Seguir editando</button><button type="button" class="btn pri" data-a="si">Cerrar</button></div>';
  bar.innerHTML=h+"</div>";bar.hidden=false}
function tablaPedido(p){var h='<div class="tbl"><table><thead><tr><th>Código</th><th>Producto</th><th class="num">Stock</th><th class="num">Pedido</th></tr></thead><tbody>',by={};
  items().forEach(function(i){by[i.c]=i});
  rubros().forEach(function(r){var l=items().filter(function(i){return i.r===r&&num(p.pedido&&p.pedido[i.c])>0});if(!l.length)return;
    h+='<tr class="sec"><td colspan="4">'+esc(r)+'</td></tr>'+l.map(function(i){var s=num(p.stock&&p.stock[i.c]);return '<tr><td>'+i.c+'</td><td>'+esc(i.n)+'</td><td class="num">'+(s===null?"–":s)+'</td><td class="num"><b>'+p.pedido[i.c]+'</b></td></tr>'}).join("")});
  return h+"</tbody></table></div>"}
function vHistPedidos(){var e=enviados().slice().reverse();if(!e.length)return '<div class="empty"><p>Cuando cierres el primer pedido va a aparecer acá, con el stock contado y las cajas pedidas.</p></div>';
  var mx=1;e.forEach(function(p){mx=Math.max(mx,sum(p.pedido).t)});
  return '<div class="head"><h2>Pedidos enviados</h2><p>'+e.length+' pedidos · tocá uno para ver el detalle</p></div>'+e.map(function(p,ix){var t=sum(p.pedido),st=sum(p.stock),op=S.hist===p.id;
    return '<section class="hist"><button type="button" data-hist="'+esc(p.id)+'" aria-expanded="'+op+'"><span class="d">'+fmtC(p.fecha)+'</span><span class="hbar"><i style="width:'+(t.t/mx*100)+'%"></i></span><span class="n"><b>'+t.t+'</b> cajas · '+fk(kilos(p.pedido).k)+'</span></button>'+
    (op?'<div class="hbody"><p class="meta"><span>'+t.n+' productos</span><span>'+fk(kilos(p.pedido).k)+(kilos(p.pedido).sin?" + "+kilos(p.pedido).sin+" bultos sin peso cargado":"")+'</span><span>Stock contado ese día: '+(Object.keys(p.stock||{}).length?cj(st.t):"sin datos")+'</span></p><div class="acts"><button type="button" class="btn" data-a="wsp" data-id="'+esc(p.id)+'">WhatsApp</button>'+
      (DL&&window.XLSX?'<button type="button" class="btn" data-a="xls" data-id="'+esc(p.id)+'">Excel</button>':"")+(DL&&window.jspdf?'<button type="button" class="btn" data-a="pdf" data-id="'+esc(p.id)+'">PDF</button>':"")+(ix===0&&!abierto()&&!S.readOnly?'<button type="button" class="btn danger" data-a="reabrir" data-id="'+esc(p.id)+'">Reabrir para corregir</button>':"")+'</div>'+tablaPedido(p)+'</div>':"")+'</section>'}).join("")}
function idealEn(p,c){var s=num(p.stock&&p.stock[c]);return s===null?null:s+(num(p.pedido&&p.pedido[c])||0)}
function serie(c){var o=[];enviados().forEach(function(p){var i=idealEn(p,c);if(i!==null)o.push({f:p.fecha,s:num(p.stock[c]),p:num(p.pedido&&p.pedido[c])||0,i:i})});return o}
function spark(v){var W=92,H=34,px=4,py=5,mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),n=v.length;
  var X=function(k){return n===1?W/2:px+k*(W-2*px)/(n-1)},Y=function(x){return mx===mn?H/2:H-py-(x-mn)*(H-2*py)/(mx-mn)};
  var pts=v.map(function(x,k){return X(k).toFixed(1)+","+Y(x).toFixed(1)}).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ideal: '+v.join(", ")+'"><line class="gl" x1="0" y1="'+(H-1)+'" x2="'+W+'" y2="'+(H-1)+'"></line>'+
  (n>1?'<polygon class="ar" points="'+X(0).toFixed(1)+','+(H-1)+' '+pts+' '+X(n-1).toFixed(1)+','+(H-1)+'"></polygon><polyline class="ln" points="'+pts+'"></polyline>':"")+
  '<circle class="pt" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(v[n-1]).toFixed(1)+'" r="3"></circle></svg>'}
function vHistIdeal(){var e=enviados().filter(function(p){return Object.keys(p.stock||{}).length});
  if(!e.length)return '<div class="empty"><p>El ideal se arma con el stock contado más las cajas pedidas. Cuando cierres un pedido con conteo va a aparecer acá.</p></div>';
  var tot=e.map(function(p){var t=0;items().forEach(function(i){var x=idealEn(p,i.c);if(x!==null)t+=x});return t}),mx=Math.max.apply(null,tot)||1;
  var all=[];activos().forEach(function(it){var sr=serie(it.c);if(sr.length)all.push({it:it,sr:sr,d:sr[sr.length-1].i-sr[0].i})});
  var list=all.filter(function(x){return match(x.it)&&(S.tend==="sube"?x.d>0:S.tend==="baja"?x.d<0:true)}),by={};list.forEach(function(x){by[x.it.c]=x});
  var f=[["todos","Todos"],["sube","Subieron"],["baja","Bajaron"]];
  var h='<div class="card"><h3>Ideal total de la cámara</h3>'+e.slice().reverse().map(function(p,k){var t=tot[e.length-1-k];return '<div class="trow"><b>'+fmtC(p.fecha)+'</b><span class="hbar"><i style="width:'+(t/mx*100)+'%"></i></span><span>'+t.toLocaleString("es-AR")+' cajas</span></div>'}).join("")+'</div>'+
  '<div class="head"><p>Ideal de cada producto = stock contado + cajas pedidas. La flecha compara el primer pedido con el último.</p></div>'+
  '<div class="chips">'+f.map(function(x){return '<button type="button" class="chip" data-tend="'+x[0]+'" aria-pressed="'+(S.tend===x[0]?"true":"false")+'">'+x[1]+'</button>'}).join("")+'</div>'+
  tools(all.map(function(x){return x.it}),function(l){return l.length});
  if(!list.length)return h+'<div class="empty"><p>No hay productos en este filtro.</p></div>';
  return h+groups(list.map(function(x){return x.it}),function(it){var x=by[it.c],sr=x.sr,a=sr[0].i,z=sr[sr.length-1].i;
    var r='<li class="row" data-c="'+it.c+'"><button type="button" class="info" data-a="ide" aria-expanded="'+(S.ide===it.c)+'"><span class="nm">'+esc(it.n)+'</span><span class="meta"><span>'+it.c+'</span><span>ideal '+a+' → <b>'+z+'</b></span>'+
      '<span class="tag '+(x.d>0?"up":x.d<0?"down":"eq")+'">'+(x.d>0?"▲ +"+x.d:x.d<0?"▼ "+x.d:"= igual")+'</span></span></button>'+spark(sr.map(function(q){return q.i}))+'</li>';
    if(S.ide===it.c)r+='<li class="edit"><div class="tbl"><table><thead><tr><th>Fecha</th><th class="num">Stock</th><th class="num">Pedido</th><th class="num">Ideal</th></tr></thead><tbody>'+
      sr.slice().reverse().map(function(q){return '<tr><td>'+fmt(q.f)+'</td><td class="num">'+q.s+'</td><td class="num">'+q.p+'</td><td class="num"><b>'+q.i+'</b></td></tr>'}).join("")+'</tbody></table></div></li>';
    return r})}
function vHistorial(){var f=[["pedidos","Pedidos"],["ideal","Evolución del ideal"]];
  return '<div class="chips">'+f.map(function(x){return '<button type="button" class="chip" data-hv="'+x[0]+'" aria-pressed="'+(S.hv===x[0]?"true":"false")+'">'+x[1]+'</button>'}).join("")+'</div>'+(S.hv==="ideal"?vHistIdeal():vHistPedidos())}
function selRubro(id,v){return '<select id="'+id+'" aria-label="Rubro">'+rubros().map(function(r){return '<option'+(r===v?" selected":"")+'>'+esc(r)+'</option>'}).join("")+'</select>'}
function vProductos(){var list=items().filter(match),h='<div class="head"><h2>Productos</h2><p>'+activos().length+" activos de "+items().length+'</p></div>';
  h+=S.adding?'<div class="empty"><div class="form"><input id="n-cod" type="text" inputmode="numeric" placeholder="Código" style="width:110px" aria-label="Código"><input id="n-nom" class="grow" type="text" placeholder="Nombre del producto" aria-label="Nombre">'+selRubro("n-rub",S.rubro)+
    '<label><input id="n-sc" type="checkbox" checked> Se cuenta en cámara</label><button type="button" class="btn pri" data-a="add-ok">Agregar</button><button type="button" class="btn" data-a="add-no">Cancelar</button></div></div>'
    :'<div><button type="button" class="btn"'+(S.readOnly?" disabled":"")+' data-a="add">Agregar producto</button></div>';
  h+=tools(items(),function(l){return l.filter(function(i){return i.a!==false}).length});

  var rows=[];Object.keys(codes).forEach(function(k){var i=codes[k],c=i.c,cm=cf?cf.get(c):null,ca=fc?fc.get(c):null,sm=fs?fs.get(c):null;
    var r={c:c,n:i.n,r:i.r,cm:cm,ca:ca,sm:sm,b:(ca||0)+(sm||0),ub:i.ub||null,tu:i.tu};r.cu=cm!==null&&r.ub?Math.round(cm*r.ub*100)/100:null;r.any=(cm||0)+(ca||0)+(sm||0)>0;rows.push(r)});

function srcBox(lbl,f,unit,tot){return '<div><span>'+lbl+'</span><b>'+(f?tot:"–")+'</b><small>'+(f?unit+" · "+(f.curso?"en curso ":"")+fmtC(f.fecha):"sin conteo")+'</small></div>'}
function vTotal(){var T=totalRows(),rows=T.rows,tc=0,ta=0,ts=0;rows.forEach(function(r){tc+=r.cm||0;ta+=r.ca||0;ts+=r.sm||0});
  var base=rows.filter(function(r){return S.tall||r.any}),list=base.filter(function(r){return (!S.rubro||r.r===S.rubro)&&fzMatch(r,S.tq)});

    '<div class="src">'+srcBox("Cámara",T.cf,"cajas",tc)+srcBox("Cárcano",T.fc,"unidades",ta)+srcBox("San Martín",T.fs,"unidades",ts)+'</div>'+
    '<div class="tools"><input id="tbuscar" type="search" placeholder="Buscar producto o código" value="'+esc(S.tq)+'" aria-label="Buscar producto"><button type="button" class="btn" data-tall="1" aria-pressed="'+S.tall+'">'+(S.tall?"Ocultar los que están en 0":"Ver también los que están en 0")+'</button>'+(window.XLSX?'<button type="button" class="btn" data-a="t-xls">Excel</button>':"")+'</div>'+
    '<div class="chips">'+chipsHTML(base,function(x){return x.length})+'</div>';
  if(!list.length)return h+'<div class="empty"><p>'+(rows.some(function(r){return r.any})?"Ningún producto coincide con la búsqueda.":"Todavía no hay conteos cargados en ningún lugar.")+'</p></div>';

  fzRubros(list).forEach(function(r){var l=list.filter(function(x){return x.r===r});
    h+='<tr class="sec"><td colspan="5">'+esc(r)+'</td></tr>'+l.map(function(x){return '<tr><td><span class="tn">'+esc(x.n)+'</span><span class="tc">'+x.c+'</span></td><td class="num">'+v(x.cm)+(x.cu!==null?'<span class="cu">'+x.cu.toLocaleString("es-AR")+(x.tu==="K"?" kg":" u")+'</span>':"")+'</td><td class="num">'+v(x.ca)+'</td><td class="num">'+v(x.sm)+'</td><td class="num tsum"><b>'+(x.ca===null&&x.sm===null?"–":x.b)+'</b></td></tr>'}).join("")});
